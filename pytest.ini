[pytest]
# Erlaubt "import backend.xxx" in Tests, ohne sys.path manuell zu manipulieren.
# Voraussetzung: pytest wird aus dem Projektstamm heraus aufgerufen (pytest).
pythonpath = .
testpaths = backend/tests
markers =
    real_auth: Test läuft ohne die Standard-Testidentität aus conftest.py (echte Auth-Kette).
